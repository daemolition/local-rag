[project]
name = "local-document-rag"
version = "0.1.0"
description = "German Flask RAG app with SSE chat, SQLAlchemy multi-user management, Qdrant hybrid search, Pandas analytics tools, and Ollama/OpenAI-compatible LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Christopher Abanilla" }
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]
dependencies = [
    "chardet>=5.2.0",
    "fastembed>=0.8.0",
    "flask>=3.0.0",
    "flask-sock>=0.7.0",
    "gradio>=6.10.0",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.12",
    "langchain-qdrant>=1.1.0",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pdfminer-six>=20260107",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.28.0",
    "pytesseract>=0.3.13",
    "qdrant-client>=1.17.1",
    "ruff>=0.15.7",
    "sentence-transformers>=5.0.0",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.67.3",
    "unstructured-pytesseract>=0.3.15",
    "imagehash>=4.3.1",
    "pillow>=11.0.0",
    "unstructured[pdf]>=0.22.6",
    "ml-dtypes>=0.5.4",
    "tabulate>=0.10.0",
    "waitress>=3.0.2",
    "gunicorn>=25.3.0",
    "alembic>=1.18.4",
    "websocket-client>=1.8.0",
]
