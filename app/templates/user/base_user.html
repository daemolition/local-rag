{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="relative w-64 bg-surface border-r border-base shadow-material-1 flex-shrink-0 flex flex-col">
        <div class="p-4 border-b border-base">
            <h2 class="text-lg font-semibold flex items-center gap-2 text-primary">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Meine Dokumente
            </h2>
            <div id="ingestionIndicator" style="display: none;" class="flex mt-2 items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500/80 animate-pulse text-white text-xs font-medium">
                <svg class="w-3.5 h-3.5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <span>Dokumentenverarbeitung läuft</span>
            </div>
        </div>
        <nav class="p-2 flex-1">
            <a href="{{ url_for('main.index') }}" class="block px-4 py-2 rounded-lg hover:bg-surface-muted transition-colors text-sm text-primary">
                ← Zurück zum Chat
            </a>
            <div class="my-2 border-t border-base"></div>
            <a href="{{ url_for('user.my_documents') }}" class="block px-4 py-2 rounded-lg {% if request.endpoint == 'user.my_documents' %}bg-surface-muted{% else %}hover:bg-surface-muted{% endif %} transition-colors text-sm text-primary">
                Dokumente
            </a>
            <a href="{{ url_for('user.my_summaries') }}" class="block px-4 py-2 rounded-lg {% if request.endpoint in ['user.my_summaries', 'user.edit_summary'] %}bg-surface-muted{% else %}hover:bg-surface-muted{% endif %} transition-colors text-sm text-primary">
                Analysen
            </a>
            <div class="my-2 border-t border-base"></div>
            <a href="{{ url_for('user.dashboard') }}" class="block px-4 py-2 rounded-lg {% if request.endpoint == 'user.dashboard' %}bg-surface-muted{% else %}hover:bg-surface-muted{% endif %} transition-colors text-sm text-primary">
                Dashboard
            </a>
            <a href="{{ url_for('user.vectordb') }}" class="block px-4 py-2 rounded-lg {% if request.endpoint in ['user.vectordb', 'user.vectordb_detail'] %}bg-surface-muted{% else %}hover:bg-surface-muted{% endif %} transition-colors text-sm text-primary">
                Vektordatenbank
            </a>
            <a href="{{ url_for('user.settings') }}" class="block px-4 py-2 rounded-lg {% if request.endpoint == 'user.settings' %}bg-surface-muted{% else %}hover:bg-surface-muted{% endif %} transition-colors text-sm text-primary">
                Einstellungen
            </a>
        </nav>
        <!-- Theme-Toggle am Sidebar-Ende -->
        <div class="p-2 border-t border-base">
            <button type="button" onclick="toggleTheme()" title="Hell/Dunkel umschalten" class="w-full flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-surface-muted text-primary transition-colors text-sm">
                <svg data-theme-icon-moon class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg data-theme-icon-sun class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <span data-theme-label>Hell/Dunkel</span>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="flex-1 p-6 bg-surface-subtle overflow-auto">
        {% block user_content %}{% endblock %}
    </main>
</div>
{% endblock %}
