{% extends "user/base_user.html" %}

{% block title %}{{ filename }} bearbeiten - Local Document RAG{% endblock %}

{% block user_content %}
<div class="max-w-5xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-gray-200 dark:border-gray-700">
        <div>
            <a href="{{ url_for('user.my_summaries') }}" class="inline-flex items-center gap-2 text-gray-500 dark:text-gray-400 hover:text-slate-700 dark:hover:text-slate-400 transition-colors text-sm mb-2">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Zurück zu meinen Summaries
            </a>
            <h1 class="text-xl font-semibold text-gray-800 dark:text-white">{{ filename }}</h1>
        </div>
        <button onclick="saveSummary()" class="inline-flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-slate-700 to-slate-800 dark:from-slate-800 dark:to-slate-900 text-white rounded-lg font-medium shadow-material-1 hover:shadow-material-2 hover:-translate-y-0.5 transition-all">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
            </svg>
            Speichern
        </button>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-material-1 overflow-hidden">
        <div class="flex border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-700">
            <button type="button" onclick="switchTab('edit')" id="tab-edit" class="inline-flex items-center gap-2 px-6 py-3 font-medium text-slate-700 dark:text-slate-400 bg-white dark:bg-gray-800 border-b-2 border-slate-600 dark:border-slate-400 transition-colors">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Bearbeiten
            </button>
            <button type="button" onclick="switchTab('preview')" id="tab-preview" class="inline-flex items-center gap-2 px-6 py-3 font-medium text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600 border-b-2 border-transparent transition-colors">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                Vorschau
            </button>
        </div>

        <div class="h-96">
            <div id="pane-edit" class="h-full">
                <textarea id="content" placeholder="Markdown-Inhalt..." class="w-full h-full p-6 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-mono text-sm resize-none focus:outline-none focus:bg-white dark:focus:bg-gray-800 transition-colors">{{ content }}</textarea>
            </div>
            <div id="pane-preview" class="h-full hidden overflow-y-auto p-6 prose dark:prose-invert max-w-none">
                <div id="preview-content" class="prose dark:prose-invert max-w-none"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_head %}
<style>
    #preview-content table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.9rem; }
    #preview-content th, #preview-content td { border: 1px solid #e5e7eb; padding: 0.5rem 0.75rem; text-align: left; }
    #preview-content th { background: #f1f5f9; font-weight: 600; }
    .dark #preview-content th { background: #4b5563; }
    .dark #preview-content th, .dark #preview-content td { border-color: #4b5563; }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="{{ url_for('static', filename='js/edit_summary.js') }}"></script>
<script>
    const saveEndpoint = '/user/summaries/{{ filename | urlencode }}/save';
</script>
{% endblock %}
