name: Images

# Container-Images fuer amd64 und arm64 nach ghcr.io, wenn ein Release-Tag (vX.Y.Z) gepusht wird.
# Jede Architektur baut auf einem eigenen nativen Runner (kein QEMU, das waere fuer das App-Image viel zu langsam);
# danach werden die Teilimages zu einem Multi-Arch-Manifest zusammengefasst.
#
#   ghcr.io/<repo>                    :X.Y.Z, :latest       CUDA-Variante, nur amd64 (NVIDIA-GPU)
#   ghcr.io/<repo>                    :X.Y.Z-cpu, :latest-cpu   CPU-Variante, amd64 und arm64
#   ghcr.io/<repo>-tool-worker        :X.Y.Z, :latest       Tool-Worker (Pandas und SQL), amd64 und arm64
#
# Die Actions sind auf Commit-SHAs gepinnt (Version im Kommentar); Dependabot aktualisiert sie.
#
# Von Hand starten (Actions > Images > Run workflow): "Version" leer = Version aus pyproject.toml (z. B. 0.2.0),
# oder "dev" fuer einen Probelauf. "latest" setzt zusaetzlich die Tags latest/latest-cpu, nur auf master.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag der Images (leer = Version aus pyproject.toml, "dev" = Probelauf)'
        required: false
        default: ""
      latest:
        description: "Auch latest und latest-cpu setzen (nur auf master)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          latest=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            latest=true
          else
            version="${INPUT_VERSION}"
            [[ -n "${version}" ]] || version="$(python3 scripts/release.py current)"
            if [[ "${INPUT_LATEST}" == "true" && "${GITHUB_REF_NAME}" == "master" && "${version}" != "dev" ]]; then latest=true; fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}, latest=${latest}"

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: app-cuda, suffix: "", file: Dockerfile, arch: amd64, runner: ubuntu-latest, args: "TORCH_BACKEND=cuda" }
          - { image: app-cpu, suffix: "", file: Dockerfile, arch: amd64, runner: ubuntu-latest, args: "TORCH_BACKEND=cpu" }
          - { image: app-cpu, suffix: "", file: Dockerfile, arch: arm64, runner: ubuntu-24.04-arm, args: "TORCH_BACKEND=cpu" }
          - { image: tool-worker, suffix: "-tool-worker", file: tool_worker/Dockerfile, arch: amd64, runner: ubuntu-latest, args: "" }
          - { image: tool-worker, suffix: "-tool-worker", file: tool_worker/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm, args: "" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Platz schaffen (das App-Image ist gross)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Name in Kleinbuchstaben
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und nach Digest pushen
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.args }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Digest merken
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} Manifest
    needs: [meta, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # tags: alle Tags des Manifests; %V% wird durch die Version ersetzt
          - { image: app-cuda, suffix: "", tags: "%V% latest" }
          - { image: app-cpu, suffix: "", tags: "%V%-cpu latest-cpu" }
          - { image: tool-worker, suffix: "-tool-worker", tags: "%V% latest" }
    steps:
      - name: Version und Namen festlegen
        run: |
          {
            echo "VERSION=${{ needs.meta.outputs.version }}"
            echo "WITH_LATEST=${{ needs.meta.outputs.latest }}"
            echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Manifest erstellen und pushen
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          for t in ${{ matrix.tags }}; do
            t="${t//%V%/${VERSION}}"
            # "latest" nur bei einem Release-Tag oder ausdruecklich (nie bei "dev")
            if [[ "${WITH_LATEST}" != "true" && "${t}" == latest* ]]; then continue; fi
            tags+=(-t "${IMAGE_NAME}:${t}")
          done
          refs=()
          for f in *; do refs+=("${IMAGE_NAME}@sha256:${f}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Pruefen
        run: |
          for t in ${{ matrix.tags }}; do
            t="${t//%V%/${VERSION}}"
            if [[ "${WITH_LATEST}" != "true" && "${t}" == latest* ]]; then continue; fi
            docker buildx imagetools inspect "${IMAGE_NAME}:${t}" | grep -E "Name:|Platform:"
          done
