version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-document-rag:arm64
    container_name: local-document-rag-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MODEL=${MODEL:-granite3.2-vision:2b-q8_0}
      - BASEURL=${BASEURL:-http://vllm:11434/v1}
      - TEMPERATURE=${TEMPERATURE:-0.1}
      - TOP_P=${TOP_P:-0.2}
      - API_KEY=${API_KEY:-loc-123}
      - EMBEDDING_SOURCE=${EMBEDDING_SOURCE:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_ENDPOINT=${EMBEDDING_ENDPOINT:-http://vllm:8080/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - RETRIEVER_K=${RETRIEVER_K:-5}
      - RETRIEVER_FETCH_K=${RETRIEVER_FETCH_K:-30}
      - RETRIEVER_LAMBDA=${RETRIEVER_LAMBDA:-0.5}
      - RETRIEVER_SCORE_THRESHOLD=${RETRIEVER_SCORE_THRESHOLD:-0.2}
      - DATA_DIR=${DATA_DIR:-./data}
      - SUMMARIES_DIR=${SUMMARIES_DIR:-./summaries}
      - QDRANT_LOCAL=${QDRANT_LOCAL:-false}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
    volumes:
      - ./files:/app/files
      - ./processed_files:/app/processed_files
      - ./summaries:/app/summaries
      - ./local_qdrant.db:/app/local_qdrant.db
      - ./images:/app/images
    networks:
      - local-rag-network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-document-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - local-rag-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  local-rag-network:
    driver: bridge

volumes:
  qdrant-storage:
    driver: local