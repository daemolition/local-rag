services:
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-document-rag
    container_name: local-document-rag
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      # Alle App-Daten (uploads, archiv, images, summaries, data) liegen im
      # einzelnen app-data-Volume als Subdirs von /app/data. Fruehere Bind-
      # Mounts (./files etc.) entfallen; nur /app/data ist ein Mountpoint,
      # die Subdirs sind normale Verzeichnisse (kein EBUSY bei rmtree/move).
      - app-data:/app/data
      # ONNX-Modell-Cache (FastEmbed). Beim ersten Start werden die zur Build-Zeit
      # vorgeladenen Modelle aus dem Image ins Volume kopiert und persistieren
      # danach ueber Image-Rebuilds hinweg.
      - fastembed-cache:/root/.cache/fastembed
      # HuggingFace-Cache: heruntergeladene Embedding-/Reranking-Modelle (z. B. bge-m3)
      # und die Docling-Modelle bleiben ueber Neustarts und Rebuilds erhalten.
      - hf-cache:/root/.cache/huggingface
    networks:
      - local-rag-network
    # GPU fuer Embedding, Reranking und Docling (braucht NVIDIA Container Toolkit).
    # Ohne GPU diesen Block entfernen und mit --build-arg TORCH_BACKEND=cpu bauen;
    # die App faellt ohne GPU automatisch auf die CPU zurueck.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: local-document-rag-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    networks:
      - local-rag-network

  entityguard:
    image: ghcr.io/s2a-open-technologies/entityguard:latest-cpu 
    container_name: local-document-rag-entityguard
    restart: always
    ports:
      - "8082:9500"
    volumes:
      - entityguard-data:/app/data
    networks:
      - local-rag-network

  parakeet:
    build:
      context: ./parakeet
      args:
        DEVICE: gpu
    image: local-document-rag-parakeet
    container_name: local-document-rag-parakeet
    restart: unless-stopped
    environment:
      - PARAKEET_MODEL=nemo-parakeet-tdt-0.6b-v3
    networks:
      - local-rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Datenbank der App (Benutzer, Chats, Einstellungen, Modelle). Zugangsdaten in .env
  # (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB); der Standardwert "rag" ist nur fuer
  # lokale Tests gedacht und sollte fuer den Betrieb geaendert werden. Kein Host-Port: nur
  # aus dem local-rag-network erreichbar.
  postgres:
    image: postgres:17
    container_name: local-document-rag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rag}
      - POSTGRES_DB=${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - local-rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-document-rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant:/qdrant/storage
    networks:
      - local-rag-network
    healthcheck:
      # Das offizielle qdrant-Image enthaelt kein wget/curl, nur bash - daher
      # TCP-Connect-Check statt HTTP-Request (wget schlug bisher immer mit
      # "executable file not found" fehl und markierte den Container dauerhaft
      # als unhealthy, unabhaengig davon ob Qdrant tatsaechlich lief).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  local-rag-network:
    driver: bridge

volumes:
  pgdata:
  qdrant:
  app-data:
  fastembed-cache:
  hf-cache:
  entityguard-data:
